<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Homework</title>

    <style>
*{
            
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }




.link {
    display: inline-block;
    padding: 15px 20px;
    border: 2px solid green;
    color: black;
    text-decoration: none;
    font-size: 20px;
}

.link:hover {
    background-color: green;
    color: white;
}




.drink-list {
    margin-top: 80px;
    width: 350px;
    background-color: yellow;
}

.drink-list li {
    color: black;
}



.drink-list li::marker {
    color: red;
}

.drink-list {
    color: black;
}




.heading-box {
    position: relative;
    margin-top: 50px;
}

.heading-box img {
    position: absolute;
    width: 70px;
    height: 100px;
    top: 0;
    left: 0;
    z-index: -1;
}

.heading-box h1 {
    padding-top: 5px;
      }
       </style>
</head>

<body>

    
    <a href="#" class="link">This is a link</a>


    
    <ul class="drink-list">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Coca Cola</li>
    </ul>


    
    <div class="heading-box">

        <img src="image1.jpg" alt="Background">

        <h1>This is a heading</h1>

        <p>
            Because the image has a z-index of -1,
            it will be placed behind the text.
        </p>

    </div>

</body>
</html>
