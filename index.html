<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>
</head>
<body>

    
    <h2 style="color: red;">
        <img src="businessmanimg.jpg" alt="User Icon" width="40" height="40"> 
        Employee Registration Form
    </h2>

    <form>
        
        <input type="radio" name="title" value="Mr" checked> Mr.
        <input type="radio" name="title" value="Mrs"> Mrs.
        <input type="radio" name="title" value="Ms"> Ms.
        <br><br>

        
        <table>
            <tr>
                <td>First Name</td>
                <td><input type="text" name="firstName" placeholder="First Name"></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text" name="lastName" placeholder="Last Name"></td>
            </tr>
            <tr>
                <td>Mail Address1</td>
                <td><input type="text" name="mail1"></td>
            </tr>
            <tr>
                <td>Mail Address2</td>
                <td><input type="text" name="mail2"></td>
            </tr>
            <tr>
                <td>City</td>
                <td><input type="text" name="city"></td>
            </tr>
            <tr>
                <td>State</td>
                <td>
                    <select name="state">
                        <option value="Gujarat" selected>Gujarat</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Zip</td>
                <td><input type="text" name="zip"></td>
            </tr>
            <tr>
                <td>Upload Photo</td>
                <td><input type="file" name="photo"></td>
            </tr>
            <tr>
                <td>E-Mail</td>
                <td><input type="text" name="email"></td>
            </tr>
            <tr>
                <td>Mobile</td>
                <td><input type="text" name="mobile" placeholder="+91"></td>
            </tr>
            
           
            <tr>
                <td valign="top">Languages known</td>
                <td>
                    <input type="checkbox" name="lang" value="Gujarati" checked> Gujarati <br>
                    <input type="checkbox" name="lang" value="Hindi" checked> Hindi <br>
                    <input type="checkbox" name="lang" value="English" checked> English <br>
                    <input type="checkbox" name="lang" value="Marathi"> Marathi
                </td>
            </tr>
            <tr>
                <td valign="top">Additional Information</td>
                <td>
                    <textarea name="info"  placeholder="Optional"></textarea>
                </td>
            </tr>
            
 
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="submit">
                    <input type="reset" value="reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
